<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASTRION</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0618; overflow: hidden; }
      /* Phaser's EXPAND mode sizes the game to this div, so it must fill the window. */
      #game { width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <!-- Phaser injects its <canvas> inside this div -->
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
