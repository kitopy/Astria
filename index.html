<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The game is already dark: dark-mode extensions (Dark Reader) must not change its colors. -->
    <meta name="darkreader-lock" />
    <meta name="color-scheme" content="dark" />
    <title>ASTRION</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0618; overflow: hidden; }
      /* Phaser's EXPAND mode sizes the game to this div, so it must fill the window. */
      #game { position: relative; z-index: 1; width: 100vw; height: 100vh; }
      /* 3D Earth (src/ui/earth3d.js), behind the game. Hidden until a mission screen shows it. */
      #earth-bg { position: fixed; inset: 0; z-index: 0; width: 100vw; height: 100vh; visibility: hidden; }
    </style>
  </head>
  <body>
    <canvas id="earth-bg"></canvas>
    <!-- Phaser injects its <canvas> inside this div -->
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
